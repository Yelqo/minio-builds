name: Validate source build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: python3 scripts/fetch-sources.py
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: minio-builds:validation
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=validation
      - run: bash scripts/smoke.sh minio-builds:validation linux/${{ matrix.arch }}
      - name: Scan the candidate before any release is tagged
        run: bash scripts/scan-image.sh linux/${{ matrix.arch }} docker:minio-builds:validation
      - name: Publish security summary
        if: always()
        run: |
          if [ -f reports/scan-summary.md ]; then cat reports/scan-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish candidate security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-security-${{ matrix.arch }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90
